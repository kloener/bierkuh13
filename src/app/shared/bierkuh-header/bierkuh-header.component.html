<header class="bierkuh-header">
  <div class="bierkuh-header__brand">
    <img class="bierkuh-header__logo max-w-full h-auto block" [attr.src]="headerPath" alt="Bierkuh13" />
  </div>
  <nav class="bierkuh-header__nav" aria-label="Hauptnavigation">
    <a
      class="bierkuh-header__pill"
      [routerLink]="homeLink()"
      routerLinkActive="bierkuh-header__pill--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      Übersicht
    </a>
    <a
      class="bierkuh-header__pill bierkuh-header__pill--icon"
      [routerLink]="adminListLink()"
      routerLinkActive="bierkuh-header__pill--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      aria-label="Kronkorken verwalten"
    >
      <svg class="h-7 w-7 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
      <span class="bierkuh-header__pill-text">Verwaltung</span>
    </a>
  </nav>
</header>
