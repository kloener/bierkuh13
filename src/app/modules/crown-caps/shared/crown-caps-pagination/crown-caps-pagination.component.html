@let _pageInfo = pageInfo();
@if (_pageInfo) {
  <div class="admin-pagination">
    @if (_pageInfo.currentPage > 1) {
      <button type="button" (click)="loadPreviousPage.emit()">Vorherige Seite</button>
    }
    <p>Seite {{ _pageInfo.currentPage }} von {{ _pageInfo.pages }}</p>
    @if (_pageInfo.currentPage < _pageInfo.pages) {
      <button type="button" (click)="loadNextPage.emit()">Nächste Seite</button>
    }
  </div>
}
