<section class="cap-table admin-table-wrap">
  <table class="admin-table">
    <thead>
      <tr>
        <th class="cap-image">Bild</th>
        <th class="cap-name">Name</th>
        <th class="cap-func">Aktionen</th>
      </tr>
    </thead>
    <tbody #tableNavRoot (keydown)="onTableKeydown($event)">
      @for (item of caps(); track item.identifier; let i = $index) {
        <tr>
          <td
            #capNav
            class="cap-image cap-table__cap-cell"
            data-cap-nav-item
            [attr.data-cap-nav-index]="i"
            [attr.tabindex]="focusedCapIndex() === i ? 0 : -1"
            (focusin)="onCapFocusIn(i)"
            (keydown)="onCapCellActivateKeydown($event, item)"
            (click)="onCapClick(item)"
          >
            <app-cap-img [name]="item.name" [fileUri]="item.storageRef"></app-cap-img>
          </td>
          <td class="cap-name font-medium">{{ item.name }}</td>
          <td class="cap-func">
            <div class="flex flex-wrap gap-2">
              <button type="button" (click)="onEditClick(item)">Bearbeiten</button>
              <button type="button" (click)="onDeleteClick(item)">Löschen</button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</section>

<div class="mt-8">
  <app-crown-caps-pagination
    [pageInfo]="pageInfo$ | async"
    (loadPreviousPage)="loadPreviousPage()"
    (loadNextPage)="loadNextPage()"
  ></app-crown-caps-pagination>
</div>
