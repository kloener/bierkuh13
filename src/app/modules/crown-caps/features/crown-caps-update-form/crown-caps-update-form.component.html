@if (details$ | async; as details) {
  <section class="admin-panel">
    <app-cap-img class="update-form__preview mx-auto my-6 block" [name]="details.name" [fileUri]="details.storageRef"></app-cap-img>
    @if (formGroup) {
      <form class="flex flex-col" [formGroup]="formGroup" (ngSubmit)="onSubmit(details)">
        <label for="input_name" class="admin-label !mt-0">Name</label>
        <input id="input_name" class="admin-input" type="text" formControlName="name" />

        <label for="input_count" class="admin-label">Anzahl Kronkorken</label>
        <input id="input_count" class="admin-input" type="text" formControlName="count" />

        <label for="input_link" class="admin-label">Link zur Webseite oder Aktion</label>
        <input id="input_link" class="admin-input" type="url" formControlName="link" />

        <label for="input_color" class="admin-label">Farbe des Kronkorkens</label>
        <input id="input_color" class="admin-input" type="text" formControlName="color" />

        <label for="input_brewery" class="admin-label">Brauerei</label>
        <input id="input_brewery" class="admin-input" type="text" formControlName="brewery" />

        <label for="input_comment" class="admin-label">Kommentar</label>
        <textarea id="input_comment" class="admin-textarea" formControlName="comment" rows="4"></textarea>

        <label for="input_year" class="admin-label">Jahr</label>
        <input id="input_year" class="admin-input" type="text" formControlName="year" />

        <label for="input_type" class="admin-label">Typ (Aktion, Jubiläum usw.)</label>
        <input id="input_type" class="admin-input" type="text" formControlName="type" />

        <label for="select_assignees" class="admin-label">Wer hat den? (Mehrfachauswahl)</label>
        <select id="select_assignees" class="admin-select" formControlName="assignees" multiple>
          <option value="H">Heini</option>
          <option value="K">Keks</option>
        </select>

        <div class="admin-form-actions">
          <button [class.has-error]="formGroup.invalid" type="submit">Speichern</button>
        </div>
      </form>
    } @else {
      <p class="text-white/70">Formular wird geladen …</p>
    }
  </section>
}

<div class="mt-8 flex justify-center">
  <a class="admin-nav-link" routerLink="/admin-list/1">Zurück zur Liste</a>
</div>
