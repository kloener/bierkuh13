<section
  #listSection
  role="list"
  aria-label="Kronkorken"
  class="list cap-list justify-center gap-x-4 gap-y-6"
  (keydown)="onListKeydown($event)"
>
  @for (item of caps(); track item.identifier || item.name; let i = $index) {
    <div
      #capNav
      role="listitem"
      class="cap-list__item outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-bierkuh-bg rounded-full"
      data-cap-nav-item
      [attr.data-cap-nav-index]="i"
      [attr.tabindex]="focusedCapIndex() === i ? 0 : -1"
      (focusin)="onCapFocusIn(i)"
      (keydown)="onCapActivateKeydown($event, item)"
      (click)="onCapClick(item)"
    >
      <app-cap-img [name]="item.name" [fileUri]="item.storageRef"></app-cap-img>
    </div>
  }
</section>

<section class="text-center mt-24">
  <app-crown-caps-load-more [autoByIntersection]="true" (loadMore)="loadMore()"></app-crown-caps-load-more>
</section>
