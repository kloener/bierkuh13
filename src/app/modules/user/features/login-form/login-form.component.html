<form class="admin-form mt-6" [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
  <label for="input_username" class="admin-label !mt-0">Benutzer</label>
  <input
    id="input_username"
    class="admin-input admin-input--wide"
    formControlName="username"
    type="text"
    autocomplete="username"
  />

  <label for="input_password" class="admin-label">Passwort</label>
  <input
    id="input_password"
    class="admin-input admin-input--wide"
    formControlName="password"
    type="password"
    autocomplete="current-password"
  />

  <div class="admin-form-actions justify-center">
    <button [class.has-error]="loginFailed" type="submit">Anmelden</button>
    <button type="button" routerLink="/">Abbrechen</button>
  </div>
</form>
